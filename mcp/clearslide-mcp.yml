blockers:
  summary: What would stop an MCP server from being usable against ClearSlide today.
  items:
  - >-
    Credentials cannot be obtained programmatically. A client id and secret are issued by a human
    replying to apisupport@clearslide.com, so no agent can self-onboard.
  - >-
    Tokens go in a non-standard `authorizationToken` header, so generic OAuth MCP scaffolding that
    assumes RFC 6750 Bearer will not authenticate.
  - >-
    Every read of presentations and insights requires a `targetUserId` header identifying whose
    data to return; an agent must be told this out of band.
  - >-
    No idempotency contract, so create_link and get_upload_credentials are unsafe to retry.
  - >-
    Only two coarse scopes (read/write), with `write` spanning both link creation and SCIM
    directory administration — there is no way to grant an agent narrow authority.
