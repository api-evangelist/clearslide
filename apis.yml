aid: clearslide
name: ClearSlide
description: >-
  ClearSlide is a sales engagement platform, now part of Bigtincan, that unifies content
  management, communications (email, web conferencing, screen share), and real-time engagement
  analytics so sales teams can make every buyer interaction count. Its public Platform API lets
  customers and partners programmatically list presentations, create trackable links, retrieve
  engagement insights, manage users (including SCIM provisioning), upload content to Amazon S3,
  and reserve and manage scheduled meetings. The API uses OAuth 2.0 and is documented on a public
  ReadMe developer portal at developer.clearslide.com. ClearSlide was originally an a16z-backed
  company and is profiled here in the API Evangelist network.
