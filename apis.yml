- aid: clearslide:clearslide-scim-api
  name: ClearSlide SCIM API
  description: >-
    ClearSlide's SCIM 2.0 (RFC 7644) user and group provisioning API, for automating directory
    sync from an identity provider. Serves /scim/ServiceProviderConfigs, /scim/Schemas (core User
    and Group), full /scim/Users and /scim/Groups CRUD, and PatchOp for group membership. Note
    PATCH on Users is documented as not supported, filtering is limited to the `eq` operator on
    userName, and DELETE deactivates rather than deletes. Documented in prose only — ClearSlide
    publishes no machine-readable contract for this surface.
  humanURL: https://developer.clearslide.com/docs/scim-at-clearslide
  baseURL: https://platform.clearslide.com/v2
  tags:
  - SCIM
  - Users
  - Groups
  - Provisioning
  - Identity
