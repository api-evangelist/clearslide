defects:
- id: api-catalog-service-desc-empty
  severity: high
  summary: >-
    Both OpenAPI service-desc documents advertised in ClearSlide's own /.well-known/api-catalog
    return HTTP 200 with a ZERO-BYTE body.
  urls:
  - url: https://developer.clearslide.com/openapi/596567bd798ff70035f1c6bf
    status: 200
    bytes: 0
  - url: https://developer.clearslide.com/openapi/5de676c15698f4005879e719
    status: 200
    bytes: 0
  impact: >-
    A conforming RFC 9727 consumer that follows the catalog to fetch the machine-readable
    contract receives an empty document and a success status. This is a soft-200: the discovery
    surface is present and correct, and the thing it points at is not there. No credit is taken
    for these two documents.
